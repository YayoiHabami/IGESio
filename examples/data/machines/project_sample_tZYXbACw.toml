# LANGラウンドプレート + マクログリップにワークを載せたセットアップ
# 機械はmachine_t-ZYX-b-AC-wを使用する（工具側X-Y-Z、テーブル側A-Cの同時5軸機）
#
# 治具 (work_mountはテーブル上面中心が基準、zが上方向):
#   ラウンドプレート上面 = +27、
#   マクログリップ原点   = +65、
#   ワーク下端          = +89、
#   ワーク上面          = +139、
#   NC原点             = +119 (ワーク上面から-20)

[format]
name = "machining-project"
version = [1, 1]

[project]
name = "multiple_obstacles"
description = "5-axis TCP path machining a workpiece on a LANG round plate and macro grip with an R3 ball end mill"
author = "Yayoi Habami"

[units]
length = "mm"
angle = "deg"

[machine]
library = "machine_t-ZYX-b-AC-w.toml"

# R3ボールエンドミル (輪郭形式. ホルダHSK-E50-HDC6S-120に突き出し25mmで取り付け)
# ホルダはホルダ下端面をz=25 (突き出し量) に置き、上端はz=175。
# ゲージラインはホルダ上面から-30mm (フランジ上面) のため、gauge_length = 175 - 30 = 145
[[tool]]
number = 12
name = "Ball R3"
gauge_length = 145.0

[tool.profile]
command_point_z = 3.0    # 先端の円弧中心

[[tool.profile.element]]
part = "cutter"
start = [0.0, 0.0]
segments = [
    { type = "arc", to = [3.0, 3.0], center = [0.0, 3.0], direction = "ccw" },
    { to = [3.0, 10.0] },
    { to = [0.0, 10.0] },
]

[[tool.profile.element]]
part = "shank"
start = [3.0, 10.0]      # 両端が回転軸上に無いため、軸までの直線を補う
segments = [{ to = [3.0, 80.0] }]

# ホルダ: HSK-E50-HDC6S-120
[[tool.profile.element]]
part = "holder"
name = "HSK-E50-HDC6S-120"
start = [0.0, 25.0]
segments = [
    { to = [7.0, 25.0] },
    { to = [12.0, 72.0] },
    { to = [20.0, 72.0] },
    { to = [20.0, 118.0] },
    { to = [23.0, 118.0] },
    { to = [23.0, 120.5] },
    { to = [20.5, 121.5] },
    { to = [20.5, 124.5] },
    { to = [23.0, 125.5] },
    { to = [23.0, 145.0] },
    { to = [21.0, 145.0] },
    { to = [20.0, 175.0] },
    { to = [0.0, 175.0] },
]

# R3ボールエンドミル (輪郭形式. テーパネック付きの工具と、主軸に差し込む部分を持つホルダ)
# 切れ刃部は先端の凸円弧 (反時計回り)、シャンク部はネックのフィレット (時計回り) を含む。
# ホルダはフランジ (z=100〜120) の上に主軸に差し込むテーパ部 (z=120〜150) を持つため、
# ゲージラインはホルダ上端ではなくフランジ上面 (gauge_length = 120) で指定する
[[tool]]
number = 13
name = "Ball R3 taper neck"
gauge_length = 120.0

[tool.profile]
command_point_z = 3.0    # 先端の円弧中心

[[tool.profile.element]]
part = "cutter"
start = [0.0, 0.0]
segments = [
    { type = "arc", to = [3.0, 3.0], center = [0.0, 3.0], direction = "ccw" },
    { to = [3.0, 12.0] },
    { to = [0.0, 12.0] },
]

# ネック部: 直径5mmに絞り、フィレットで直径8mmのシャンクにつなぐ
# (始点と終点が回転軸上に無いため、軸までの直線は読込時に補われる)
[[tool.profile.element]]
part = "shank"
name = "neck"
start = [2.5, 12.0]
segments = [
    { to = [2.5, 30.0] },
    { type = "arc", to = [4.0, 31.5], center = [4.0, 30.0], direction = "cw" },
    { to = [4.0, 80.0] },
]

# ホルダ: コレットチャック (z=60〜100)、フランジ (z=100〜120)、テーパ部 (z=120〜150)
[[tool.profile.element]]
part = "holder"
color = "#8090a0"
start = [0.0, 60.0]
segments = [
    { to = [15.0, 60.0] },
    { to = [20.0, 90.0] },
    { to = [20.0, 100.0] },
    { to = [30.0, 100.0] },
    { to = [30.0, 120.0] },
    { to = [22.0, 120.0] },
    { to = [12.0, 150.0] },
    { to = [0.0, 150.0] },
]

# 工具長補正 (NCのG43.5H12). 長さは工具12のゲージ長をデフォルト値とする
[[tool_offset]]
number = 12
tool = 12

# NC座標系: ワークモデル原点から (-44.57, 0, -20) の点
# 登録値形式: ゼロポーズでtool_mountフレーム原点 (0, -180, 250.5) をNC原点
# (機械座標 (-89.57, -50, 119)) に置くNC指令値. 回転軸A/Cは省略 (0)
[[work_offset]]
id = "G54"
values = { X = -89.57, Y = 130.0, Z = -131.5 }

# ラウンドプレート
# 原点は上面中央、下面まで27mm
# ラウンドプレート下面をテーブル上面に置く
[[model]]
name = "round_plate"
role = "fixture"
file = "jigs/lang_round-plate_45901.STL"
origin = [0.0, 0.0, 27.0]

# マクログリップ
# 原点は中央、下面まで-38mm
# マクログリップ下面をラウンドプレート上面に置き、z軸まわりに90度回転
[[model]]
name = "macro_grip"
role = "fixture"
file = "jigs/lang_macro-grip_48120-77_slides=100.STL"
attach = "round_plate"
origin = [0.0, 0.0, 38.0]
rotation_axis_angle = { axis = [0.0, 0.0, 1.0], angle = 90.0 }

# ワークモデル
# 原点は上面の角 (上面中央まで+45, +50)、上面から底面まで-50mm
# ワーク下端をグリップ原点+24に置く (上面は+74mm). 上面中央をグリップ中央に合わせる
[[model]]
name = "work"
role = "stock"
file = "work_models/multiple_obstacles.stl"
attach = "round_plate"
origin = [-45.0, -50.0, 112.0]

[[program]]
file = "nc/multiple_obstacles.mcd"
type = "gcode"
encoding = "utf-8"

[initial]
tool = 12
work_offset = "G54"

[run]
overtravel = "warning"
