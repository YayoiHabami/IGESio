name: CD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  package:
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            configure: -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - os: ubuntu-latest
            platform: linux-x64
            configure: -G Ninja "-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++"
          - os: macos-latest
            platform: macos-arm64
            configure: -G Ninja

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build xorg-dev libgl1-mesa-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build ${{ matrix.configure }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DIGESIO_BUILD_TESTING=OFF \
          -DIGESIO_BUILD_EXAMPLE=ON -DIGESIO_BUILD_GUI=ON \
          -DIGESIO_ENABLE_ALL_EXTENSIONS=ON

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Collect package
      shell: bash
      run: |
        PKG="IGESio-$(git describe --tags --always)-${{ matrix.platform }}"
        cmake --install build --config Release --component samples \
          --prefix "dist/$PKG"
        echo "PKG=$PKG" >> "$GITHUB_ENV"

    - name: Verify package
      shell: bash
      run: |
        ROOT="$PWD/dist/$PKG"
        test -f "$ROOT/data/input.igs"
        ls "$ROOT"/iges_viewer*
        # Run outside the package so that outputs do not end up in it
        cd "$RUNNER_TEMP"
        "$ROOT/machining_viewer" --help
        "$ROOT/iges_data_io" "$ROOT/data/input.igs"

    - name: Create archive
      shell: bash
      working-directory: dist
      run: |
        # Archive before uploading: artifacts do not keep the executable bit
        if [ "$RUNNER_OS" = "Windows" ]; then
          7z a "$PKG.zip" "$PKG"
        else
          tar czf "$PKG.tar.gz" "$PKG"
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PKG }}
        path: |
          dist/*.zip
          dist/*.tar.gz
        if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: packages
        merge-multiple: true

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" packages/* \
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes
